<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disc Shelf</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Disc Shelf">
<meta name="theme-color" content="#1456d8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600&display=swap">
<style>
/* Layout: one phone column. Tally header, a big scan action that opens a live camera, a result panel under it, then the collection list. */
:root {
  color-scheme: light;
  --bg: #f1f3f8; --surface: #ffffff; --fg: #141a2a; --muted: #586179; --line: #d8dde8;
  --accent: #1456d8; --accent-fg: #ffffff;
  --new: #17794a; --new-soft: #e2f4ea; --dup: #9a5200; --dup-soft: #fff0d6; --danger: #b3261e;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0d111a; --surface: #161b27; --fg: #e8ecf5; --muted: #98a2b9; --line: #2a3246;
    --accent: #6ea1ff; --accent-fg: #091326;
    --new: #5fd196; --new-soft: #11281c; --dup: #f2b35c; --dup-soft: #33240b; --danger: #ff8a80;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; line-height: 1.15; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; line-height: 1.25; }
p { margin: 0; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top > div { min-width: 0; }
.tally { font: 400 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn {
  font: 600 15px var(--font-body); min-height: 48px; padding: 0 18px; border-radius: 10px; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); border: 1px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; text-align: center; gap: 8px;
}
.btn.alt { background: var(--surface); color: var(--fg); border-color: var(--line); }
.btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn:focus-visible, .scan-btn:focus-visible, .row-main:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.scan { display: flex; flex-direction: column; gap: 12px; }
.scan-btn {
  display: flex; align-items: center; gap: 16px; min-height: 84px; padding: 16px 18px; cursor: pointer; width: 100%; text-align: left;
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 14px; font: inherit;
}
.scan-btn b { display: block; font: 600 1.2rem var(--font-display); }
.scan-btn small { display: block; font-size: 13px; opacity: 0.88; line-height: 1.35; }
.cam { position: relative; border-radius: 14px; overflow: hidden; background: #000; }
.cam video { display: block; width: 100%; max-height: 62vh; object-fit: cover; }
.reticle { position: absolute; left: 8%; right: 8%; top: 50%; height: 0; border-top: 2px solid #ff4d4d; box-shadow: 0 0 0 9999px rgba(0,0,0,0.28); pointer-events: none; }
.cam-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); color: #fff; font-size: 14px; }
.cam-bar .btn { min-height: 40px; background: rgba(255,255,255,0.92); color: #141a2a; }
.manual { display: flex; gap: 8px; }
input[type="text"], input[type="search"], input[type="tel"] {
  font: 400 16px var(--font-body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; min-height: 48px; padding: 0 12px; width: 100%; min-width: 0;
}
.manual input { font-family: var(--font-mono); }
::placeholder { color: var(--muted); opacity: 0.85; }

.panel { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.dup { background: var(--dup-soft); border-color: var(--dup); }
.panel.new { background: var(--new-soft); border-color: var(--new); }
.eyebrow { font: 600 12px var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; }
.panel.dup .eyebrow { color: var(--dup); }
.panel.new .eyebrow { color: var(--new); }
.upc { font: 500 15px var(--font-mono); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.panel h2 { overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .btn { flex: 1 1 140px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; color: var(--muted); }
.msg { font-size: 14px; color: var(--muted); }

.list { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
#rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
#rows:empty { display: none; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row-main { background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 12px 8px 12px 14px; cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .t { font-weight: 500; overflow-wrap: anywhere; }
.row .u { font: 400 12px var(--font-mono); color: var(--muted); letter-spacing: 0.04em; }
.row .q { font: 500 15px var(--font-mono); padding: 0 14px 0 6px; font-variant-numeric: tabular-nums; }
.row .q.many { color: var(--accent); }
.row-edit { grid-column: 1 / -1; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); border-top: 1px solid var(--line); }
.rename { display: flex; gap: 8px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; }
.empty b { font-family: var(--font-display); font-size: 1.05rem; }
.muted { color: var(--muted); }
.foot { font-size: 13px; color: var(--muted); }
.flag { align-self: flex-start; margin-top: 4px; font: 600 11px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--dup); background: var(--dup-soft); border: 1px solid var(--dup); border-radius: 999px; padding: 1px 8px; }
.dup-group { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--dup); }
.dup-group b { overflow-wrap: anywhere; }
.dup-group .u { font: 400 12px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
#toast { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; pointer-events: none;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#toast span { background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 100%; overflow-wrap: anywhere; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Disc Shelf</h1>
      <p class="tally" id="tally">Loading…</p>
    </div>
    <button class="btn alt small" id="export" type="button" hidden>Export CSV</button>
  </header>

  <section class="scan" aria-label="Scan a disc">
    <button class="scan-btn" id="startCam" type="button">
      <svg width="40" height="40" viewBox="0 0 34 34" fill="currentColor" aria-hidden="true"><rect x="3" y="6" width="2" height="22"/><rect x="7" y="6" width="1" height="22"/><rect x="10" y="6" width="3" height="22"/><rect x="15" y="6" width="1" height="22"/><rect x="18" y="6" width="2" height="22"/><rect x="22" y="6" width="1" height="22"/><rect x="25" y="6" width="3" height="22"/><rect x="30" y="6" width="1" height="22"/></svg>
      <span><b>Scan barcode</b><small>Opens your camera. Point it at the UPC on the back of the case.</small></span>
    </button>
    <div class="cam" id="cam" hidden>
      <video id="video" playsinline muted></video>
      <div class="reticle"></div>
      <div class="cam-bar"><span>Line the bars up with the red line</span><button class="btn small" id="stopCam" type="button">Stop</button></div>
    </div>
    <form class="manual" id="manual" autocomplete="off">
      <label class="sr" for="manualUpc">Barcode number</label>
      <input id="manualUpc" type="tel" inputmode="numeric" placeholder="Or type the number">
      <button class="btn alt" type="submit" id="manualGo">Check</button>
    </form>
  </section>

  <section id="result" aria-live="polite" hidden></section>

  <section id="dups" aria-label="Possible duplicates" hidden></section>

  <section class="list" aria-label="Collection">
    <h2>Collection</h2>
    <input id="filter" type="search" placeholder="Filter by title or number" hidden>
    <ul id="rows"></ul>
    <div class="empty" id="empty" hidden>
      <b>Your shelf is empty</b>
      <p class="muted">Scan the first disc above. Every disc you record shows up here, and scanning one you already own warns you right away.</p>
    </div>
  </section>
  <p class="foot" id="storeNote">Saved on this phone, in this browser.</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- barcode helpers ---------- */
  function normalize(raw) {
    var c = String(raw || "").replace(/\D/g, "");
    if (c.length === 13 && c.charAt(0) === "0") c = c.slice(1);
    return c;
  }
  function checksumOk(c) {
    if (!/^\d+$/.test(c) || (c.length !== 12 && c.length !== 13)) return false;
    var d = c.padStart(13, "0").split("").map(Number), t = 0;
    for (var i = 0; i < 12; i++) t += d[i] * (i % 2 ? 3 : 1);
    return (10 - (t % 10)) % 10 === d[12];
  }
  function fmtUpc(c) {
    if (c.length === 12) return c[0] + " " + c.slice(1, 6) + " " + c.slice(6, 11) + " " + c[11];
    if (c.length === 13) return c[0] + " " + c.slice(1, 7) + " " + c.slice(7);
    return c;
  }
  function normTitle(t) { return String(t).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
  function cleanTitle(t) {
    return String(t || "").replace(/\s*[\(\[][^)\]]*(blu-?ray|dvd|4k|uhd|digital)[^)\]]*[\)\]]/gi, "").replace(/\s*[-:]\s*(blu-?ray|dvd|4k ultra hd)\s*$/i, "").trim();
  }
  function today() { try { return new Date().toLocaleDateString("en-CA"); } catch (e) { return ""; } }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  /* ---------- same show and season detection (special editions do not matter) ---------- */
  var WORDS = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, first: 1, second: 2, third: 3, fourth: 4, fifth: 5, sixth: 6, seventh: 7, eighth: 8, ninth: 9, tenth: 10 };
  var NUMRE = "(\\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten)";
  var ORDRE = "(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|\\d{1,2}(?:st|nd|rd|th))";
  var SEASON_PATTERNS = [
    new RegExp("\\b(?:season|series|volume|vol\\.?)\\s*" + NUMRE + "\\b", "i"),
    new RegExp("\\b" + ORDRE + "\\s+(?:season|series)\\b", "i"),
    /\bs(\d{1,2})\b/i
  ];
  var EDITION_RE = /\b(?:special|collector'?s|limited|extended|unrated|uncut|director'?s|theatrical|ultimate|deluxe|anniversary|remastered|restored|widescreen|fullscreen|steelbook|bonus|edition|cut|version|blu-?ray|dvd|4k|uhd|hd|digital|combo pack|box set|disc set|discs?|complete)\b/gi;
  function seasonNumber(s) {
    var w = String(s).toLowerCase();
    if (WORDS[w]) return WORDS[w];
    var n = parseInt(w, 10);
    return isNaN(n) ? null : n;
  }
  function deriveWork(title) {
    var t = String(title || "").replace(/[\(\[][^)\]]*[\)\]]/g, " "), season = null;
    for (var i = 0; i < SEASON_PATTERNS.length && season == null; i++) {
      var m = t.match(SEASON_PATTERNS[i]);
      if (m) { season = seasonNumber(m[1]); if (season != null) t = t.replace(m[0], " "); }
    }
    t = t.replace(EDITION_RE, " ").replace(/\s+/g, " ").trim();
    if (season != null) t = t.split(/\s*[:\u2013\u2014]\s*|\s+-\s+/)[0].trim();
    t = t.replace(/^[\s:\-\u2013\u2014]+|[\s:\-\u2013\u2014]+$/g, "");
    return { label: t || String(title || "").trim(), season: season };
  }
  function identity(d) {
    var derived = deriveWork(d.title);
    var label = d.series ? String(d.series).trim() : derived.label;
    var season = (d.season != null && String(d.season).trim() !== "") ? seasonNumber(String(d.season).trim()) : null;
    if (season == null) season = derived.season;
    var norm = normTitle(label).replace(/^the /, "");
    return { label: label, season: season, key: norm ? norm + "|" + (season == null ? "" : season) : "" };
  }
  var dupCache = { groups: [], counts: {} };
  function computeGroups() {
    var map = {};
    inv.forEach(function (d) { var k = identity(d).key; if (k) (map[k] = map[k] || []).push(d); });
    var out = { groups: [], counts: {} };
    Object.keys(map).forEach(function (k) {
      out.counts[k] = map[k].length;
      if (map[k].length > 1) out.groups.push(map[k].sort(function (a, b) { return a.upc < b.upc ? -1 : 1; }));
    });
    return out;
  }
  function flagFor(d) {
    return dupCache.counts[identity(d).key] > 1 ? h("span", { class: "flag", text: "Possible duplicate" }) : null;
  }
  function renderDups() {
    var box = $("dups");
    box.textContent = "";
    var groups = dupCache.groups;
    box.hidden = !groups.length;
    if (!groups.length) return;
    box.append(h("div", { class: "panel dup" },
      h("span", { class: "eyebrow", text: "Possible duplicates" }),
      h("p", { text: plural(groups.length, "title appears", "titles appear") + " more than once, counting different editions as the same." }),
      groups.map(function (g) {
        var w = identity(g[0]);
        return h("div", { class: "dup-group" },
          h("b", { text: w.label + (w.season != null ? " · Season " + w.season : "") }),
          g.map(function (d) { return h("span", { class: "u", text: d.title + " · " + fmtUpc(d.upc) + " · ×" + d.qty }); }));
      })));
  }

  /* ---------- collection, saved in this browser ---------- */
  var KEY = "disc-shelf-v1", inv = new Map(), persisted = true;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); Object.keys(o).forEach(function (k) { var v = o[k]; inv.set(k, { upc: String(v.upc || k), title: String(v.title || "Untitled"), qty: Math.max(1, Number(v.qty) || 1), added: String(v.added || ""), series: String(v.series || ""), season: String(v.season != null ? v.season : "") }); }); }
  } catch (e) { persisted = false; }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(inv))); }
    catch (e) { persisted = false; $("storeNote").textContent = "This browser would not save the list. It will be lost when you close the page."; }
  }
  function saveDoc(doc) { inv.set(doc.upc, doc); persist(); renderAll(); }
  function deleteDoc(upc) { inv.delete(upc); persist(); renderAll(); }
  if (!persisted) $("storeNote").textContent = "This browser would not save the list. It will be lost when you close the page.";

  /* ---------- UI state and helpers ---------- */
  var ui = { phase: "idle", upc: "", title: "", msg: "", hit: null, open: null, confirmDel: false };
  function h(tag, props) {
    var el = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, v);
    });
    kids.forEach(function addKid(kid) {
      if (kid == null || kid === false) return;
      if (Array.isArray(kid)) { kid.forEach(addKid); return; }
      el.append(kid.nodeType ? kid : document.createTextNode(kid));
    });
    return el;
  }
  var toastTimer = null;
  function toast(text) {
    var box = $("toast"); box.textContent = ""; box.append(h("span", { text: text }));
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { box.textContent = ""; }, 3200);
  }
  function resetUi() { ui.phase = "idle"; ui.upc = ""; ui.title = ""; ui.msg = ""; ui.hit = null; renderResult(); }

  /* ---------- live camera scanning ---------- */
  var reader = null, scanning = false;
  function camError(e) {
    var n = e && e.name;
    if (n === "NotAllowedError" || n === "SecurityError") return "Camera access was blocked. Allow the camera for this site in your browser settings, then tap Scan barcode again.";
    if (n === "NotFoundError" || n === "OverconstrainedError") return "No camera was found on this device.";
    if (n === "NotReadableError") return "The camera is in use by another app. Close it and try again.";
    return "The camera could not start. Make sure this page is open in Safari or Chrome over https, or type the number instead.";
  }
  function stopCam() {
    scanning = false;
    try { if (reader) reader.reset(); } catch (e) {}
    reader = null;
    $("cam").hidden = true; $("startCam").hidden = false;
  }
  async function startCam() {
    if (scanning) return;
    ui.phase = "idle"; renderResult();
    if (typeof window.ZXing === "undefined") { showFail("The scanner could not load. Check your connection and reload the page, or type the number instead."); return; }
    $("startCam").hidden = true; $("cam").hidden = false; scanning = true;
    try {
      var hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.EAN_13]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      reader = new ZXing.BrowserMultiFormatReader(hints, 200);
      await reader.decodeFromVideoDevice(null, $("video"), function (result) {
        if (!scanning || !result) return;
        var c = normalize(result.getText());
        if (!checksumOk(c)) return;
        stopCam();
        handleUpc(c);
      });
    } catch (e) {
      stopCam();
      showFail(camError(e));
    }
  }
  function showFail(msg) { ui.phase = "failed"; ui.msg = msg; renderResult(); }

  /* ---------- scan flow ---------- */
  async function lookupTitle(upc) {
    try {
      var r = await fetch("https://api.upcitemdb.com/prod/trial/lookup?upc=" + encodeURIComponent(upc), { headers: { Accept: "application/json" } });
      if (!r.ok) return null;
      var j = await r.json();
      var t = j && j.items && j.items[0] && j.items[0].title;
      return t ? cleanTitle(t) : null;
    } catch (e) { return null; }
  }
  async function handleUpc(upc) {
    ui.upc = upc; ui.title = ""; ui.msg = ""; ui.hit = null;
    if (inv.has(upc)) { ui.phase = "duplicate"; renderResult(); $("result").scrollIntoView({ block: "nearest" }); return; }
    ui.phase = "looking"; renderResult(); $("result").scrollIntoView({ block: "nearest" });
    var t = await lookupTitle(upc);
    if (ui.phase !== "looking" || ui.upc !== upc) return;
    if (t) { ui.title = t; ui.msg = "Found in the barcode database. Check the title, then save."; }
    else ui.msg = "Not found in the free barcode database. Type the title from the cover.";
    ui.phase = "new"; renderResult();
  }
  function addCopy(upc) {
    var cur = inv.get(upc); if (!cur) return;
    var doc = Object.assign({}, cur, { qty: cur.qty + 1 });
    saveDoc(doc);
    toast("Now " + plural(doc.qty, "copy", "copies") + " of " + doc.title);
    resetUi();
  }
  function saveNew(force) {
    var title = ui.title.trim(); if (!title) return;
    var me = identity({ title: title }), hit = null;
    inv.forEach(function (d) { if (!hit && d.upc !== ui.upc && me.key && identity(d).key === me.key) hit = d; });
    ui.me = me;
    if (hit && !force) { ui.hit = hit; ui.phase = "confirm"; renderResult(); return; }
    saveDoc({ upc: ui.upc, title: title, series: me.label, season: me.season == null ? "" : String(me.season), qty: 1, added: today() });
    toast("Recorded " + title);
    resetUi();
  }

  /* ---------- rendering ---------- */
  function renderResult() {
    var box = $("result"); box.textContent = ""; box.hidden = ui.phase === "idle";
    if (ui.phase === "idle") return;
    if (ui.phase === "looking") { box.append(h("div", { class: "panel" }, h("span", { class: "eyebrow", text: "New" }), h("h2", { text: "Looking up the title…" }), h("p", { class: "upc", text: fmtUpc(ui.upc) }))); return; }
    if (ui.phase === "failed") {
      box.append(h("div", { class: "panel" }, h("h2", { text: "Couldn't scan" }), h("p", { class: "msg", text: ui.msg }),
        h("div", { class: "actions" }, h("button", { class: "btn", type: "button", onclick: startCam }, "Try again"), h("button", { class: "btn alt", type: "button", onclick: resetUi }, "Dismiss"))));
      return;
    }
    if (ui.phase === "duplicate") {
      var d = inv.get(ui.upc);
      box.append(h("div", { class: "panel dup" }, h("span", { class: "eyebrow", text: "Duplicate" }), h("h2", { text: d.title }),
        h("p", { text: "You already have " + plural(d.qty, "copy", "copies") + " of this one." }), h("p", { class: "upc", text: fmtUpc(d.upc) }),
        h("div", { class: "actions" }, h("button", { class: "btn", type: "button", onclick: function () { addCopy(d.upc); } }, "Add another copy"),
          h("button", { class: "btn alt", type: "button", onclick: function () { resetUi(); startCam(); } }, "Skip and scan next"))));
      return;
    }
    if (ui.phase === "new") {
      var input = h("input", { id: "titleInput", type: "text", value: ui.title, placeholder: "Title as printed on the cover", autocomplete: "off", autocapitalize: "words" });
      var save = h("button", { class: "btn", type: "button", disabled: !ui.title.trim(), onclick: function () { saveNew(false); } }, "Save disc");
      input.addEventListener("input", function () { ui.title = input.value; save.disabled = !input.value.trim(); });
      input.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && input.value.trim()) { ev.preventDefault(); saveNew(false); } });
      box.append(h("div", { class: "panel new" }, h("span", { class: "eyebrow", text: "New" }), h("h2", { text: "Not in your collection yet" }), h("p", { class: "upc", text: fmtUpc(ui.upc) }),
        h("div", { class: "field" }, h("label", { for: "titleInput", text: "Title" }), input),
        ui.msg ? h("p", { class: "msg", text: ui.msg }) : null,
        h("div", { class: "actions" }, save, h("button", { class: "btn alt", type: "button", onclick: resetUi }, "Cancel"))));
      return;
    }
    if (ui.phase === "confirm" && ui.hit) {
      var hit = ui.hit;
      box.append(h("div", { class: "panel dup" }, h("span", { class: "eyebrow", text: "Possible duplicate" }), h("h2", { text: hit.title }),
        h("p", { text: "You already have " + (ui.me && ui.me.season != null ? "season " + ui.me.season + " of this show" : "this title") + ", recorded as " + hit.title + " (" + fmtUpc(hit.upc) + ", " + plural(hit.qty, "copy", "copies") + "). Special editions and reissues still count as possible duplicates." }),
        h("div", { class: "actions" },
          h("button", { class: "btn", type: "button", onclick: function () { saveNew(true); } }, "Save as separate edition"),
          h("button", { class: "btn alt", type: "button", onclick: function () { addCopy(hit.upc); } }, "Count as a copy of it"),
          h("button", { class: "btn alt", type: "button", onclick: function () { ui.phase = "new"; renderResult(); } }, "Back"))));
    }
  }
  function sorted() { return Array.from(inv.values()).sort(function (a, b) { return a.title.localeCompare(b.title, undefined, { sensitivity: "base" }); }); }
  function renderTally() {
    var discs = 0; inv.forEach(function (d) { discs += d.qty; });
    $("tally").textContent = inv.size ? plural(discs, "disc", "discs") + " · " + plural(inv.size, "title", "titles") : "Nothing recorded yet";
    $("export").hidden = !inv.size; $("filter").hidden = inv.size < 6; $("empty").hidden = inv.size !== 0;
  }
  function renderList() {
    var rowsEl = $("rows"); rowsEl.textContent = "";
    var q = $("filter").value.trim().toLowerCase();
    sorted().filter(function (d) { return !q || d.title.toLowerCase().indexOf(q) >= 0 || d.upc.indexOf(q) >= 0; }).forEach(function (d) {
      var open = ui.open === d.upc;
      var li = h("li", { class: "row" },
        h("button", { class: "row-main", type: "button", "aria-expanded": String(open), onclick: function () { ui.open = open ? null : d.upc; ui.confirmDel = false; renderList(); } },
          h("span", { class: "t", text: d.title }), h("span", { class: "u", text: fmtUpc(d.upc) }), flagFor(d)),
        h("span", { class: "q" + (d.qty > 1 ? " many" : ""), text: "×" + d.qty }));
      if (open) {
        var rn = h("input", { id: "renameInput", type: "text", value: d.title, "aria-label": "Title", autocomplete: "off" });
        li.append(h("div", { class: "row-edit" },
          h("div", { class: "rename" }, rn, h("button", { class: "btn alt small", type: "button", onclick: function () { var t = rn.value.trim(); if (t && t !== d.title) { saveDoc(Object.assign({}, d, { title: t })); toast("Renamed"); } } }, "Rename")),
          h("div", { class: "actions" },
            h("button", { class: "btn alt small", type: "button", disabled: d.qty <= 1, onclick: function () { saveDoc(Object.assign({}, d, { qty: d.qty - 1 })); } }, "Remove a copy"),
            h("button", { class: "btn alt small", type: "button", onclick: function () { saveDoc(Object.assign({}, d, { qty: d.qty + 1 })); } }, "Add a copy"),
            h("button", { class: "btn danger small", type: "button", onclick: function () {
              if (!ui.confirmDel) { ui.confirmDel = true; renderList(); return; }
              ui.confirmDel = false; ui.open = null; deleteDoc(d.upc); toast("Removed " + d.title);
            } }, ui.confirmDel ? "Tap again to remove" : "Remove title"))));
      }
      rowsEl.append(li);
    });
  }
  function renderAll() { dupCache = computeGroups(); renderTally(); renderDups(); renderList(); }

  /* ---------- export ---------- */
  function csvCell(s) { s = String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function exportCsv() {
    var csv = ["Title,UPC,Quantity,Added"].concat(sorted().map(function (d) { return [d.title, d.upc, d.qty, d.added].map(csvCell).join(","); })).join("\n");
    var url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    var a = h("a", { href: url, download: "disc-collection.csv" });
    document.body.append(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  /* ---------- wiring ---------- */
  $("startCam").addEventListener("click", startCam);
  $("stopCam").addEventListener("click", stopCam);
  $("manual").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var c = normalize($("manualUpc").value);
    if (!checksumOk(c)) { showFail("That number does not pass the barcode check. Re-read the digits under the bars (usually 12) and try again."); return; }
    $("manualUpc").value = ""; stopCam(); handleUpc(c);
  });
  $("filter").addEventListener("input", renderList);
  $("export").addEventListener("click", exportCsv);
  renderAll();
})();
</script>
</body>
</html>
